    <!-- Login Screen -->
    <div id="login-screen">
        <div class="login-card">
            <h2>Đăng Nhập Hệ Thống</h2>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tài khoản">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>
            <button class="btn" style="width: 100%" onclick="login()">Đăng Nhập</button>
            <p id="msg" style="color: red; text-align: center; font-size: 0.9em; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app" style="display: none;">
        <header>
            <h1>🩺 Quản Lý Khám Sức Khỏe</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span style="color: var(--text-muted); font-weight: 500;">👤 <span id="user-fullname">Admin</span></span>
                <button class="btn btn-success" onclick="exportExcel()">📥 Xuất Excel</button>
                <button class="btn btn-danger" onclick="logout()">Thoát</button>
            </div>
        </header>

        <div class="container">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('tab-hanhchinh')">Thông tin Hành chính</button>
                <button class="nav-tab" onclick="switchTab('tab-tiensu')">Tiền sử bệnh tật</button>
                <button class="nav-tab" onclick="switchTab('tab-theluc')">Khám thể lực</button>

                <button class="nav-tab" onclick="switchTab('tab-canlamsang')">Cận lâm sàng</button>
                <button class="nav-tab" onclick="switchTab('tab-ketluan')">Kết luận</button>
            </div>

            <label title="Cột 89 (Excel)">LOẠI I</label>
            <input type="text" id="f_89" class="form-control" placeholder="Nhập loại i">
        </div>
    
        <div class="form-group">
            <label title="Cột 90 (Excel)">> 60T THA</label>
            <input type="text" id="f_90" class="form-control" placeholder="Nhập > 60t tha">

    </div>

                    
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; align-items: center; gap: 20px;">
                        <span id="submit-msg" style="font-weight: 500; font-size: 15px;"></span>
                        <button type="submit" class="btn btn-success" id="btn-submit" style="padding: 12px 30px; font-size: 16px;">💾 LƯU DỮ LIỆU VÀO GOOGLE SHEET</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwhMPW7PRVIi_7Qa6BdtKSH29ePJBCho03pnwO8rwYmfuDErDouyEd_bsm5dk2T_y7Yhw/exec';

        window.onload = () => {
            const user = localStorage.getItem('user');
            if(user) {
                document.getElementById('user-fullname').innerText = JSON.parse(user).fullName;
                showApp();
                if(document.getElementById('f_21')) document.getElementById('f_21').valueAsDate = new Date();
            }
        };

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            if(!u || !p) { msg.innerText = "Vui lòng nhập đầy đủ"; return; }
            msg.innerText = "Đang đăng nhập...";
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'login', username: u, password: p })
                }).then(r => r.json());
                
                if(res.success) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('user', JSON.stringify(res.user));
                    location.reload();
                } else {
                    msg.innerText = res.message;
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối Server: " + err;
            }
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const msg = document.getElementById('submit-msg');
            
            btn.disabled = true;
            btn.innerText = "Đang lưu...";
            msg.innerText = "";

            const formData = new Array(91).fill("");
            formData[0] = "";
            for(let i=1; i<=90; i++) {
                const el = document.getElementById("f_"+i);
                if(el) formData[i] = el.value;
            }
            const khom = document.getElementById("khom").value;

            const token = localStorage.getItem('token');
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'submitData', token: token, data: { fields: formData, khom: khom } })
                }).then(r => r.json());

                if(res.success) {
                    msg.style.color = "var(--success)";
                    msg.innerText = "✅ Lưu thành công!";
                    setTimeout(() => {
                        document.getElementById('ksk-form').reset();
                        if(document.getElementById('f_21')) document.getElementById('f_21').valueAsDate = new Date();
                        switchTab('tab-hanhchinh');
                        document.querySelector('.nav-tab').classList.add('active');
                        msg.innerText = "";
                        btn.disabled = false;
                        btn.innerText = "💾 LƯU DỮ LIỆU VÀO GOOGLE SHEET";
                    }, 2000);
                } else {
                    msg.style.color = "var(--danger)";
                    msg.innerText = "❌ Lỗi: " + res.message;
                    btn.disabled = false;
                    btn.innerText = "💾 LƯU DỮ LIỆU VÀO GOOGLE SHEET";
                }
            } catch (err) {
                msg.style.color = "var(--danger)";
                msg.innerText = "❌ Lỗi kết nối Server";
                btn.disabled = false;
                btn.innerText = "💾 LƯU DỮ LIỆU VÀO GOOGLE SHEET";
            }
        }

        function exportExcel() {
            const token = localStorage.getItem('token');
            if(!token) return alert('Chưa đăng nhập!');
            window.location.href = `/api/export?token=${token}`;
        }
    </script>
</body>
</html>
