    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwhMPW7PRVIi_7Qa6BdtKSH29ePJBCho03pnwO8rwYmfuDErDouyEd_bsm5dk2T_y7Yhw/exec';

        // Khởi động
        window.onload = () => {
            const user = localStorage.getItem('user');
            if(user) {
                document.getElementById('user-fullname').innerText = JSON.parse(user).fullName;
                showApp();
                if(document.getElementById('f_21')) document.getElementById('f_21').valueAsDate = new Date(); // set ngày hôm nay
            }
        };

        // Chuyển Tab
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Login
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            if(!u || !p) { msg.innerText = "Vui lòng nhập đầy đủ"; return; }
            msg.innerText = "Đang đăng nhập...";
            
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'login', username: u, password: p })
                }).then(r => r.json());
                
                if(res.success) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('user', JSON.stringify(res.user));
                    location.reload();
                } else {
                    msg.innerText = res.message;
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối Server: " + err;
            }
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // Lưu dữ liệu

            const btn = document.getElementById('btn-submit');
            const msg = document.getElementById('submit-msg');
            
            btn.disabled = true;
            btn.innerText = "Đang lưu...";
            msg.innerText = "";

            // Thu thập data map thành object
